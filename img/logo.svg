<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 64" fill="none">
  <!-- Logo provisorio: frasco de perfume dorado con iniciales BT -->
  <!-- Tapa -->
  <rect x="18" y="2" width="16" height="10" rx="2" fill="#C9A24B"/>
  <!-- Cuello -->
  <rect x="22" y="12" width="8" height="6" fill="#A8852F"/>
  <!-- Frasco -->
  <rect x="5" y="18" width="42" height="44" rx="7" fill="#C9A24B"/>
  <!-- Brillo -->
  <rect x="9" y="22" width="4" height="30" rx="2" fill="#E3C67F" opacity="0.6"/>
  <!-- Iniciales -->
  <text x="26" y="47" text-anchor="middle"
        font-family="Playfair Display, Georgia, serif" font-weight="700"
        font-size="18" fill="#1C1C1C" letter-spacing="1">BT</text>
</svg>
